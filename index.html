
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Low Premium Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Cài đặt cơ bản & Biến màu sắc */
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff007f;
            --bg-card: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Nền gradient tối sang trọng */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text-main);
            padding-bottom: 80px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Hiệu ứng ánh sáng nền */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(106,17,203,0.2) 0%, transparent 60%);
            z-index: -1;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 20px 20px;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(to right, #ff007f, #2575fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0px 0px 20px rgba(255, 0, 127, 0.3);
        }
        .header p {
            font-size: 14px;
            color: #a0a0a0;
            margin-top: 5px;
        }

        /* Khu vực nội dung */
        .container {
            padding: 0 20px;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none;
            opacity: 0;
        }

        /* Thẻ sản phẩm (Glassmorphism) */
        .product-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:active {
            transform: scale(0.98);
        }

        .product-info h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #fff;
        }
        .product-info .price {
            font-size: 16px;
            font-weight: bold;
            color: #00ff87; /* Màu xanh lá neon */
            text-shadow: 0 0 10px rgba(0, 255, 135, 0.5);
        }

        /* Nút Mua (Neon Button) */
        .buy-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.4);
            transition: all 0.3s ease;
        }
        .buy-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(37, 117, 252, 0.8);
        }

        /* Thanh Điều Hướng Dưới (Bottom Nav) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px 15px;
            border-radius: 15px;
        }
        .nav-item span {
            font-size: 22px;
            margin-bottom: 4px;
            transition: transform 0.3s ease;
        }
        .nav-item.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        .nav-item.active span {
            transform: translateY(-3px);
        }

        /* CSS cho phần Cá nhân */
        .profile-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff007f, #2575fc);
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>LOW PREMIUM</h1>
        <p>Trải nghiệm đỉnh cao - Mua sắm thả ga</p>
    </div>

    <!-- Trang chủ -->
    <div id="page-home" class="container">
        <div class="product-card" style="justify-content: center; text-align: center; flex-direction: column;">
            <h3>👋 Chào mừng đến với cửa hàng!</h3>
            <p style="color: #aaa; margin-top: 10px; font-size: 14px;">Chuyển sang tab Cửa Hàng để xem các sản phẩm hot nhất.</p>
        </div>
    </div>

    <!-- Trang cửa hàng -->
    <div id="page-shop" class="container hidden">
        <div id="product-list"></div>
    </div>

    <!-- Trang cá nhân -->
    <div id="page-profile" class="container hidden">
        <div class="profile-card">
            <div class="avatar">👤</div>
            <h2 id="user-name-display" style="font-size: 20px;">Đang tải...</h2>
            <p id="user-id-display" style="color: #aaa; font-size: 14px; margin-top: 5px;">ID: ...</p>
        </div>
    </div>

    <!-- Thanh Menu Dưới -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span>Trang chủ</div>
        <div class="nav-item" onclick="switchTab('shop', this)"><span>🛒</span>Cửa hàng</div>
        <div class="nav-item" onclick="switchTab('profile', this)"><span>👤</span>Cá nhân</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Mở rộng toàn màn hình

        // Lấy thông tin User
        if (tg.initDataUnsafe?.user) {
            document.getElementById('user-name-display').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('user-id-display').innerText = "ID: " + tg.initDataUnsafe.user.id;
        } else {
            document.getElementById('user-name-display').innerText = "Khách";
        }

        // Chuyển Tab
        function switchTab(tabName, element) {
            // Ẩn tất cả các trang
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-shop').classList.add('hidden');
            document.getElementById('page-profile').classList.add('hidden');
            
            // Hiện trang được chọn
            document.getElementById('page-' + tabName).classList.remove('hidden');

            // Đổi trạng thái nút menu
            let navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        // Danh sách sản phẩm mẫu
        const products = [
            { id: 1, name: "CapCut 1 Tháng", price: "30.000đ" },
            { id: 2, name: "Netflix Premium 1 Tháng", price: "50.000đ" },
            { id: 3, name: "Spotify Premium 6 Tháng", price: "120.000đ" }
        ];

        // Render sản phẩm
        let productHTML = "";
        products.forEach(p => {
            productHTML += `
                <div class="product-card">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p class="price">${p.price}</p>
                    </div>
                    <button class="buy-btn" onclick="buyProduct(${p.id})">MUA</button>
                </div>
            `;
        });
        document.getElementById('product-list').innerHTML = productHTML;

        // Xử lý mua
        function buyProduct(id) {
            tg.HapticFeedback.impactOccurred('medium'); // Rung điện thoại
            tg.showConfirm("Bạn có chắc muốn mua sản phẩm này không?", function(confirmed) {
                if (confirmed) {
                    // Gửi dữ liệu về bot
                    tg.sendData(JSON.stringify({ action: "buy", product_id: id }));
                }
            });
        }
    </script>
</body>
</html>
