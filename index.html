<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Low Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #ff007f;
            --secondary: #2575fc;
            --bg-dark: #0f0c29;
            --card-bg: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff; min-height: 100vh; padding-bottom: 80px;
        }
        .header { text-align: center; padding: 30px 20px; }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(to right, #ff007f, #2575fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
        }
        .container { padding: 0 20px; }
        .hidden { display: none; }
        
        .product-card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 20px; margin-bottom: 20px; display: flex;
            justify-content: space-between; align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .product-info h3 { font-size: 18px; margin-bottom: 5px; }
        .product-info .price { color: #00ff87; font-weight: bold; font-size: 16px; }
        
        .buy-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 10px 25px;
            border-radius: 12px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
        }
        .buy-btn:active { transform: scale(0.9); }

        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: rgba(15, 12, 41, 0.9); backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 20px 20px 0 0; z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #888; font-size: 12px; cursor: pointer; padding: 10px 20px; border-radius: 15px;
        }
        .nav-item span { font-size: 24px; margin-bottom: 5px; }
        .nav-item.active { color: #fff; background: rgba(255, 255, 255, 0.1); }
        
        .profile-card {
            background: var(--card-bg); padding: 30px; border-radius: 20px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(45deg, #ff007f, #2575fc);
            margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 40px;
        }
    </style>
</head>
<body>

    <div class="header"><h1>Low Premium</h1></div>

    <div id="page-home" class="container">
        <div class="product-card" style="flex-direction: column; text-align: center;">
            <h3>👋 Chào mừng đến với Low Shop!</h3>
            <p style="color: #aaa; margin-top: 10px;">Chuyển sang tab Cửa Hàng để mua sắm.</p>
        </div>
    </div>

    <div id="page-shop" class="container hidden">
        <div id="product-list"></div>
    </div>

    <div id="page-profile" class="container hidden">
        <div class="profile-card">
            <div class="avatar">👤</div>
            <h2 id="user-name">Đang tải...</h2>
            <p id="user-id" style="color: #aaa; margin-top: 5px;">ID: ...</p>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span>Trang chủ</div>
        <div class="nav-item" onclick="switchTab('shop', this)"><span>🛒</span>Cửa hàng</div>
        <div class="nav-item" onclick="switchTab('profile', this)"><span>👤</span>Cá nhân</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe?.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('user-id').innerText = "ID: " + tg.initDataUnsafe.user.id;
        }

        function switchTab(tabName, element) {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-shop').classList.add('hidden');
            document.getElementById('page-profile').classList.add('hidden');
            document.getElementById('page-' + tabName).classList.remove('hidden');

            let navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        // Dữ liệu sản phẩm mẫu
        const products = [
            { id: 1, name: "CapCut 1 Tháng", price: "30.000đ" },
            { id: 2, name: "Netflix Premium", price: "50.000đ" }
        ];

        let productHTML = "";
        products.forEach(p => {
            productHTML += `
                <div class="product-card">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p class="price">${p.price}</p>
                    </div>
                    <button class="buy-btn" onclick="buyProduct(${p.id})">MUA</button>
                </div>
            `;
        });
        document.getElementById('product-list').innerHTML = productHTML;

        function buyProduct(id) {
            tg.HapticFeedback.impactOccurred('medium');
            tg.showConfirm("Bạn có chắc muốn mua sản phẩm này?", function(confirmed) {
                if (confirmed) {
                    tg.sendData(JSON.stringify({ action: "buy", product_id: id }));
                }
            });
        }
    </script>
</body>
</html>
