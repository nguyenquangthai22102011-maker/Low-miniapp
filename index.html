<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>Chào mừng đến với Mini App!</h1>
    <p id="user-name">Đang tải...</p>
    <button onclick="tg.showAlert('Bạn đã bấm nút!')">Bấm vào tôi</button>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe?.user) {
            document.getElementById('user-name').innerText = "Xin chào, " + tg.initDataUnsafe.user.first_name + "!";
        }
    </script>
</body>
</html>
