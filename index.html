  <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Low Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-purple: #bc13fe;
            --neon-pink: #ff007f;
            --neon-blue: #00f3ff;
            --bg-dark: #0a0514;
            --card-bg: rgba(188, 19, 254, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background-color: var(--bg-dark); color: #fff; min-height: 100vh; padding-bottom: 80px;
            background-image: radial-gradient(circle at 15% 50%, rgba(188, 19, 254, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(0, 243, 255, 0.15), transparent 25%);
        }

        .header { text-align: center; padding: 30px 20px 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        
        /* Hiệu ứng đèn flash chạy quanh viền tên */
        .title-container {
            position: relative; display: inline-block; padding: 5px 15px;
        }
        .header h1 {
            font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
            color: #fff; position: relative; z-index: 2;
            text-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
        }
        /* Đèn flash chạy vòng quanh */
        .title-container::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple), var(--neon-blue), var(--neon-pink));
            background-size: 400%; z-index: 1; border-radius: 15px; filter: blur(8px);
            animation: flashing 3s linear infinite;
        }
        @keyframes flashing {
            0% { background-position: 0% 50%; }
            50% { background-color: var(--neon-blue); }
            100% { background-position: 400% 50%; }
        }

        /* Icon tích xanh */
        .verified-icon {
            width: 30px; height: 30px; z-index: 2;
            filter: drop-shadow(0 0 5px var(--neon-blue));
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .container { padding: 0 20px; transition: opacity 0.3s ease; }
        .hidden { display: none; opacity: 0; }

        .card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(188, 19, 254, 0.3); border-radius: 20px;
            padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
        }
        .card-info h3 { font-size: 18px; margin-bottom: 8px; color: #fff; }
        .price { color: var(--neon-blue); font-weight: bold; font-size: 16px; text-shadow: 0 0 5px var(--neon-blue); }
        
        .btn {
            background: transparent; color: #fff; border: 2px solid var(--neon-purple);
            padding: 10px 20px; border-radius: 12px; font-weight: bold; font-size: 14px;
            cursor: pointer; box-shadow: 0 0 10px var(--neon-purple), inset 0 0 5px var(--neon-purple);
            transition: all 0.2s ease;
        }
        .btn:active { background: var(--neon-purple); box-shadow: 0 0 20px var(--neon-purple); transform: scale(0.95); }

        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 75px;
            background: rgba(10, 5, 20, 0.9); backdrop-filter: blur(15px);
            border-top: 1px solid rgba(188, 19, 254, 0.4);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 25px 25px 0 0; z-index: 100; padding: 0 10px;
            box-shadow: 0 -5px 20px rgba(188, 19, 254, 0.2);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #777; font-size: 11px; cursor: pointer; padding: 8px 15px; border-radius: 15px;
            transition: all 0.3s;
        }
        .nav-item span { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: var(--neon-purple); text-shadow: 0 0 8px var(--neon-purple); }

        .profile-card { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .avatar {
            width: 90px; height: 90px; border-radius: 50%;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            display: flex; justify-content: center; align-items: center; font-size: 45px;
            box-shadow: 0 0 20px var(--neon-pink); margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Header có tích xanh và đèn flash -->
    <div class="header">
        <div class="title-container">
            <h1>LOW PREMIUM</h1>
        </div>
        <!-- Icon tích xanh SVG -->
        <svg class="verified-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L15.09 5.26L19.53 5.91L18.26 10.11L21.5 13.25L18.26 16.39L19.53 20.59L15.09 21.24L12 24L8.91 21.24L4.47 20.59L5.74 16.39L2.5 13.25L5.74 10.11L4.47 5.91L8.91 5.26L12 2Z" fill="#00f3ff"/>
            <path d="M10.5 14.5L7.5 11.5L8.91 10.09L10.5 11.68L15.09 7.09L16.5 8.5L10.5 14.5Z" fill="#0a0514"/>
        </svg>
    </div>

    <div id="page-home" class="container">
        <div class="card" style="flex-direction: column; text-align: center;">
            <h3>🚀 Chào mừng đến với Hệ Thống!</h3>
            <p style="color: #bbb; margin-top: 10px; font-size: 14px;">Vui lòng chọn các mục bên dưới để trải nghiệm dịch vụ.</p>
        </div>
    </div>

    <div id="page-shop" class="container hidden">
        <div id="product-list"></div>
    </div>

    <div id="page-hack" class="container hidden">
        <h2 style="text-align: center; margin-bottom: 20px; color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink);">🔥 KHU VỰC TẢI HACK 🔥</h2>
        
        <div class="card">
            <div class="card-info">
                <h3>FF Mod Menu (Auto Headshot)</h3>
                <p style="color: #aaa; font-size: 12px; margin-top: 5px;">Phiên bản: v1.2 | Dung lượng: 15MB</p>
            </div>
            <!-- Nút tải file (Xem hướng dẫn ở dưới) -->
            <button class="btn" onclick="downloadFile('https://link_file_cua_ban.com/file.apk')">TẢI</button>
        </div>
    </div>

    <div id="page-profile" class="container hidden">
        <div class="card profile-card">
            <div class="avatar">👤</div>
            <h2 id="user-name">Đang tải...</h2>
            <p id="user-id" style="color: var(--neon-blue); margin-top: 8px;">ID: ...</p>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span>Trang chủ</div>
        <div class="nav-item" onclick="switchTab('shop', this)"><span>🛒</span>Cửa hàng</div>
        <div class="nav-item" onclick="switchTab('hack', this)"><span>⚡</span>Tải Hack</div>
        <div class="nav-item" onclick="switchTab('profile', this)"><span>👤</span>Cá nhân</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe?.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('user-id').innerText = "ID: " + tg.initDataUnsafe.user.id;
        }

        function switchTab(tabName, element) {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-shop').classList.add('hidden');
            document.getElementById('page-hack').classList.add('hidden');
            document.getElementById('page-profile').classList.add('hidden');
            
            document.getElementById('page-' + tabName).classList.remove('hidden');

            let navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }

        const products = [
            { id: 1, name: "Acc CapCut 1 Tháng", price: "30.000đ" },
            { id: 2, name: "Netflix Premium 1 Tháng", price: "50.000đ" }
        ];

        let productHTML = "";
        products.forEach(p => {
            productHTML += `
                <div class="card">
                    <div class="card-info">
                        <h3>${p.name}</h3>
                        <p class="price">${p.price}</p>
                    </div>
                    <button class="btn" onclick="buyProduct(${p.id})">MUA</button>
                </div>
            `;
        });
        document.getElementById('product-list').innerHTML = productHTML;

        function buyProduct(id) {
            tg.HapticFeedback.impactOccurred('medium');
            tg.showConfirm("Bạn có chắc muốn mua sản phẩm này?", function(confirmed) {
                if (confirmed) {
                    tg.sendData(JSON.stringify({ action: "buy", product_id: id }));
                }
            });
        }

        // Hàm tải file
        function downloadFile(url) {
            tg.HapticFeedback.notificationOccurred('success');
            tg.openLink(url); // Mở link tải file bằng trình duyệt
        }
    </script>
</body>
</html>
